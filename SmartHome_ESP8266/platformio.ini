; =============================================================================
; SmartHome ESP8266 — PlatformIO Configuration
; =============================================================================

[env:esp8266]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Library dependencies
lib_deps =
    ; MQTT client for AWS IoT Core
    knolleary/PubSubClient @ ^2.8
    ; JSON parsing (cJSON - Espressif's own C library)
    https://github.com/DaveGamble/cJSON.git
    ; ESP32-compatible Preferences API for ESP8266
    vshymanskyy/Preferences @ ^2.1.0
